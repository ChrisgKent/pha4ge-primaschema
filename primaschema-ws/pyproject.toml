[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "primaschema-submit"
version = "0.1.0"
description = "Web submission portal for primaschema primer schemes"
requires-python = ">=3.12"
dependencies = [
    "primaschema>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pygithub>=2.0",
]

[project.scripts]
primaschema-submit = "primaschema_submit.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.14.6",
]
